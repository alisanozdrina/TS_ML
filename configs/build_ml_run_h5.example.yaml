# Config-driven example for build_ml_run_h5.py

station: 23
year: 2022
run_start: 1000
run_end: 1002

input_dir: /fs/ess/PAS2608/rnog/data/full/root
output_dir: /fs/ess/PAS2608/alisa/rno_g/TS_ML/ml_dataset/data/station23_2022

# Current training assumption: station 23 2022 data are noise/background.
# Simulation shards should use label: 1 and source_type: simulation.
label: 0
source_type: data
event_weight: 1.0

# Local NuRadioMC checkout to import before any installed copy.
nuradio_path: /users/PCON0003/anozdrina/rno-g/updatedCRpipeline/NuRadioMC

detector_source: rnog_mongo
# detector_source: rnog_file
# detector_file: /path/to/detector.json.xz

# dataProviderRNOG applies calibrated/converted waveforms and a configurable
# channelPreprocessor chain in this checkout. Keep upsampling off if you need
# the output to remain exactly [24, 2048].
preprocessor:
  apply_block_offset_removal: true
  apply_glitch_detection: true
  apply_cable_delay: true
  apply_hw_phase_removal: false
  apply_upsampling: false
  apply_cw_removal: false
  apply_bandpass: false

# The older standard RNOG example processing can be added on top, but it
# upsamples to 5 GHz and may change trace length.
apply_standard_processing: false
output_resample_rate_ghz:

reader_kwargs:
  read_calibrated_data: false
  convert_to_voltage: true
  mattak_kwargs:
    backend: uproot
    read_daq_status: false
    read_run_info: false

features:
  # snr is needed for snr/coherent_snr; max_amplitude and
  # impulse_correlations are needed for the PA/HPOL amplitude ratio and
  # PA impulse-template averages. The builder auto-adds these if omitted.
  feature_groups: [snr, max_amplitude, impulse_correlations]
  set_channel_parameters: true

hit_filter:
  complete_time_check: true
  complete_hit_check: true

# 3D interferometric reco features. The full reco setup is loaded from the
# deep_cr_search reco config, with the table path from pipeline.yaml.
# When enabled, /features gains rho, phi, z, max_corr, and surf_corr_zen.
reco3d:
  enabled: true
  config_file: /users/PCON0003/anozdrina/rno-g/updatedCRpipeline/deep_cr_search/workflow/configs/reco.yaml
  time_delay_tables: /fs/ess/PAS2608/alisa/rno_g/deepCRsearch/data/multiray_tables
  channels: [0, 1, 2, 3, 5, 6, 7, 9, 10, 22, 23, 4, 8, 11, 21]
  coord_system: cylindrical
  validation: true
  apply_upsampling: true
  upsampling_rate_ghz: 10.0

compression: gzip
waveform_chunk_events: 64
waveform_units: NuRadioReco voltage units
# Output includes /trace_start_time and /trace_delta_t with shape [events, 24].
continue_on_run_error: true
